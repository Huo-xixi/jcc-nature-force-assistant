  <head>

    <title>自然之力助手 · 图片识别工作台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#vision"><img class="brand-mark" src="./assets/jcc-app-icon.jpg" alt="金铲铲之战游戏图标" /><span>自然之力助手<small>S18 · 图片识别与阵容推荐</small></span></a>
      <span class="version">课程演示原型 · 18.4 数据快照</span>
    </header>
    <main>
      <section class="intro">
        <div><p class="eyebrow">IMAGE → REVIEW → RECOMMEND</p><h1>阵容建议</h1><p>上传 MuMu 模拟器截图，系统识别画面中的英雄；人工改名、补充或删除后，直接生成阵容推荐。</p></div>
        <div class="flow" aria-label="操作流程"><span><b>1</b>上传截图</span><i>→</i><span><b>2</b>人工修正</span><i>→</i><span><b>3</b>查看推荐</span></div>
      </section>
      <div class="prototype-notice"><strong>当前识别范围</strong>：已接入 S18 商店一费卡识别，支持 15 条图鉴记录（14 个不同视觉类别）；非一费卡或低置信度卡位显示“未知”，需要人工修正。</div>
      <div id="workspace"></div>
    </main>
    <p id="feedback" class="toast" role="status" aria-live="polite"></p>
    <script src="./fixtures.js"></script>
    <script src="./resource-model.js"></script>
